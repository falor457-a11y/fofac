async function planNotif(){
const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;if(!P)return;
try{
let p=await P.checkPermissions();
if(p.display==='prompt'||p.display==='prompt-with-rationale')p=await P.requestPermissions();
if(p.display!=='granted')return;
const pend=await P.getPending();if(pend.notifications.length)await P.cancel({notifications:pend.notifications});
const dues=SRS.list.filter(c=>c.st).map(c=>c.st.due).sort((a,b)=>a-b);if(!dues.length)return;
const now=Date.now(),first=dues[0];let at;
if(first<=now){at=new Date();at.setHours(10,0,0,0);if(+at<=now+6e4)at.setDate(at.getDate()+1)}
else{at=new Date(first);at.setHours(10,0,0,0);if(+at<=now+6e4)at=new Date(Math.max(first,now+6e4))}
const n=dues.filter(d=>d<=+at).length;
await P.schedule({notifications:[{id:1,title:'fofac',body:'Пора повторять: '+n+' '+(n%10===1&&n%100!==11?'карточка':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'карточки':'карточек'),schedule:{at,allowWhileIdle:true}}]})
}catch(e){}}
/* ===== Мои карточки с интервальным повторением (SM-2, как в Anki) ===== */
const DAY=864e5;
let SRS={list:[],day:'',n:0,lim:20};
try{const z=JSON.parse(localStorage.getItem('gq_srs2'));if(z&&Array.isArray(z.list))SRS={...SRS,...z}}catch(e){}
const srsSave=()=>{try{localStorage.setItem('gq_srs2',JSON.stringify(SRS))}catch(e){}planNotif()};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return +d};
function rollDay(){const k=new Date().toDateString();if(SRS.day!==k){SRS.day=k;SRS.n=0;srsSave()}}
const fresh0=()=>({ef:2.5,iv:0,reps:0,lapses:0});
function sched(c,r){
c={...c};
if(r===0){c.reps=0;c.iv=0;c.ls=0;c.lapses=(c.lapses||0)+1;c.ef=Math.max(1.3,c.ef-.2);c.due=Date.now()+6e4;return c}
if(c.reps===0){/* новая карточка: Трудно 6 мин, Хорошо 2 дня, Легко 5 дней */
if(r===1){c.iv=0;c.due=Date.now()+6*6e4;return c}
c.ls=0;c.iv=r===2?2:5;if(r===3)c.ef+=.15;c.reps=1;c.due=today0()+c.iv*DAY;return c}
if(r===1){c.iv=c.reps?Math.max(c.iv+1,Math.round(c.iv*1.2)):1;c.ef=Math.max(1.3,c.ef-.15)}
else if(r===2){c.iv=c.reps===0?2:Math.max(c.iv+1,Math.round(c.iv*c.ef))}
else{c.iv=c.reps===0?4:Math.max(c.iv+2,Math.round(c.iv*c.ef*1.3));c.ef+=.15}
c.reps++;c.due=today0()+c.iv*DAY;return c}
function fmtIv(c,r){const n=sched(c,r);if(!n.iv)return '<'+Math.max(1,Math.round((n.due-Date.now())/6e4))+' мин.';const d=n.iv;return d<30?d+' дн.':d<365?Math.round(d/30)+' мес.':(d/365).toFixed(1)+' г.'}
function when(ts){const n=Date.now();if(ts<=n)return 'сейчас';if(ts<today0()+DAY){const m=Math.max(1,Math.round((ts-n)/6e4));return m<60?'через '+m+' мин':'сегодня'}const d=Math.floor((ts-today0())/DAY);return d===1?'завтра':'через '+d+' д'}
function srsStats(){rollDay();const now=Date.now();let due=0,nw=0,learned=0;
SRS.list.forEach(c=>{if(!c.st)nw++;else{if(c.st.due<=now)due++;if(c.st.iv>=21)learned++}});
return{due,fresh:Math.min(nw,Math.max(0,SRS.lim-SRS.n)),total:SRS.list.length,learned}}

function deckScreen(){
document.onkeydown=null;const s=srsStats(),now=Date.now();
const rows=SRS.list.map(c=>`<div class="row"><div class="tx">${esc(c.f.replace(/\s+/g,' '))}</div><small>${c.st?(c.st.due<=now?'сейчас':when(c.st.due)):'новая'}</small><button class="quit" data-e="${c.id}">✎</button><button class="quit" data-d="${c.id}">✕</button></div>`).join('');
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← На главную</button><span class="mn">Мои карточки: ${s.total} <button class="quit" id="mn" title="Модули" style="font-size:18px;line-height:1;padding:3px 12px">⋯</button></span></div>
<div class="fb" style="margin:0 0 12px">К повторению: <b>${s.due}</b> · новых сегодня: <b>${s.fresh}</b> · выучено: <b>${s.learned}</b></div>
<button class="big" id="st" style="margin-top:0"${s.due+s.fresh?'':' disabled'}>Учить (${s.due+s.fresh})</button>
<div class="lv"><button id="add">Добавить</button><button id="rs"${s.total?'':' disabled'}>Заново</button></div>
${rows?`<div style="max-height:42vh;overflow-y:auto">${rows}</div>`:'<div class="sub center">Пока пусто. Добавь первую карточку.</div>'}
<div class="sub" style="margin:12px 0 0">Новых карточек в день: <input type="number" id="lim" min="1" max="500" value="${SRS.lim}" style="width:72px;padding:4px 8px"></div>`;
document.getElementById('bk').onclick=home;
document.getElementById('mn').onclick=modulesScreen;
document.getElementById('st').onclick=srsStart;
document.getElementById('add').onclick=()=>editScreen();
arm(document.getElementById('rs'),'Сбросить прогресс?',()=>{SRS.list.forEach(c=>{delete c.st});SRS.n=0;srsSave();deckScreen()});
document.getElementById('lim').onchange=e=>{SRS.lim=Math.max(1,Math.min(500,+e.target.value||20));srsSave();deckScreen()};
box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editScreen(b.dataset.e));
box.querySelectorAll('[data-d]').forEach(b=>arm(b,'Точно?',()=>{SRS.list=SRS.list.filter(c=>c.id!==b.dataset.d);srsSave();deckScreen()}))}

function editScreen(id,note){
document.onkeydown=null;
const c=id?SRS.list.find(x=>x.id===id):null;
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← Назад</button><span>${c?'Редактирование':'Новая карточка'}</span></div>
<label class="lb" for="f">Лицевая сторона (вопрос / слово)</label><textarea id="f" rows="3"></textarea>
<label class="lb" for="b">Оборот (ответ)</label><textarea id="b" rows="3"></textarea>
<label class="lb" for="t">Заметка или пример (необязательно)</label><textarea id="t" rows="2"></textarea>
<div class="sub" id="msg" style="margin:10px 0 0;min-height:18px">${note||''}</div>
<button class="big" id="sv" style="margin-top:6px">Сохранить</button>
${c?'':'<button class="big alt" id="sv2">Сохранить и добавить ещё</button>'}`;
const F=document.getElementById('f'),B=document.getElementById('b'),T=document.getElementById('t');
if(c){F.value=c.f;B.value=c.b;T.value=c.t||''}
const save=more=>{const f=F.value.trim(),b=B.value.trim(),t=T.value.trim();
if(!f||!b){document.getElementById('msg').textContent='⚠️ Заполни лицевую сторону и оборот.';return}
if(c){c.f=f;c.b=b;c.t=t}else SRS.list.push({id:uid(),f,b,t});
srsSave();more?editScreen(null,'✅ Карточка добавлена'):deckScreen()};
document.getElementById('sv').onclick=()=>save(false);
if(!c)document.getElementById('sv2').onclick=()=>save(true);
document.getElementById('bk').onclick=deckScreen;
F.focus()}

function bulkScreen(note,text){
document.onkeydown=null;
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← Назад</button><span>Добавить списком</span></div>
<div class="sub" style="margin:0 0 8px">Одна карточка на строку: <b>вопрос | ответ | заметка</b> (заметка необязательна).</div>
<textarea id="bt" rows="10" placeholder="I have lived here since 2020 | Present Perfect | since + момент начала&#10;a few | немного (исчисляемые) | a few friends"></textarea>
<div class="sub" id="msg" style="margin:10px 0 0;min-height:18px">${note||''}</div>
<button class="big" id="ad" style="margin-top:6px">Добавить</button>
<button class="big alt" id="ex">Показать все мои карточки текстом (для копирования)</button>`;
const bt=document.getElementById('bt');bt.value=text||'';
document.getElementById('bk').onclick=deckScreen;
document.getElementById('ad').onclick=()=>{
let ok=0,dup=0;const bad=[];
bt.value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
const p=l.split(/\s*\|\s*|\t/).map(x=>x.trim());
if(p.length<2||!p[0]||!p[1]){bad.push(l);return}
if(SRS.list.some(x=>x.f===p[0]&&x.b===p[1])){dup++;return}
SRS.list.push({id:uid(),f:p[0],b:p[1],t:p.slice(2).join(' | ')});ok++});
srsSave();
bulkScreen(`✅ Добавлено: ${ok}`+(dup?` · дубликатов пропущено: ${dup}`:'')+(bad.length?` · строк без «|» осталось для правки: ${bad.length}`:''),bad.join('\n'))};
document.getElementById('ex').onclick=()=>{
const cl=x=>String(x).replace(/\s*\n\s*/g,' ').replace(/\|/g,'/');
bt.value=SRS.list.map(c=>[c.f,c.b,c.t].filter((x,i)=>i<2||x).map(cl).join(' | ')).join('\n')}}

const MODS=[{id:'w1000',ico:'📚',name:'1000 самых популярных слов',desc:'Частотные английские слова с переводом. Добавляй пачками по 50 — они попадут в твою колоду.',words:W1000,pack:50}];
function modulesScreen(){
document.onkeydown=null;
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← К карточкам</button><span>Модули</span></div>
${MODS.map(m=>`<div class="pk"><div class="tx"><b>${m.name}</b><br><small>${m.desc}</small></div><button class="quit" data-m="${m.id}">Открыть</button></div>`).join('')}`;
document.getElementById('bk').onclick=deckScreen;
box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>moduleScreen(MODS.find(m=>m.id===b.dataset.m)))}
function moduleScreen(m,note){
document.onkeydown=null;
const has=new Set(SRS.list.map(c=>c.f+'|'+c.b)),n=Math.ceil(m.words.length/m.pack);
const packs=Array.from({length:n},(_,k)=>{const a=k*m.pack,w=m.words.slice(a,a+m.pack),d=w.filter(x=>has.has(x[0]+'|'+x[1])).length;return{a,w,d}});
const tot=packs.reduce((t,p)=>t+p.d,0);
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← Модули</button><span>${m.ico} ${m.name}</span></div>
<div class="fb" style="margin:0 0 12px">В модуле слов: <b>${m.words.length}</b> · в твоей колоде: <b>${tot}</b><br><small style="color:var(--mu)">Лицевая сторона — слово, оборот — перевод.</small></div>
<div class="sub" id="msg" style="min-height:18px;margin:0 0 8px">${note||''}</div>
<button class="big" id="all" style="margin-top:0"${tot===m.words.length?' disabled':''}>Добавить все (${m.words.length-tot})</button>
${tot?`<button class="big alt" id="rm" style="margin-top:10px">🗑 Удалить добавленные из модуля (${tot})</button>`:''}
<div style="max-height:46vh;overflow-y:auto;margin-top:12px">${packs.map((p,k)=>`<div class="pk"><div class="tx">${p.a+1}–${p.a+p.w.length}<br><small>${esc(p.w.slice(0,4).map(x=>x[0]).join(', '))}…</small></div>${p.d===p.w.length?'':`<button class="quit" data-p="${k}">＋ Добавить${p.d?' ('+(p.w.length-p.d)+')':''}</button>`}${p.d?`<button class="quit rd" data-x="${k}">Удалить</button>`:''}</div>`).join('')}</div>`;
const add=ws=>{const h=new Set(SRS.list.map(c=>c.f+'|'+c.b));let ok=0;
ws.forEach(x=>{if(!h.has(x[0]+'|'+x[1])){SRS.list.push({id:uid(),f:x[0],b:x[1],t:''});ok++}});
srsSave();moduleScreen(m,'✅ Добавлено карточек: '+ok)};
document.getElementById('bk').onclick=modulesScreen;
const rm=document.getElementById('rm');
if(rm)arm(rm,'Точно удалить? Нажми ещё раз',()=>{const k=new Set(m.words.map(x=>x[0]+'|'+x[1]));
const before=SRS.list.length;SRS.list=SRS.list.filter(c=>!k.has(c.f+'|'+c.b));srsSave();
moduleScreen(m,'🗑 Удалено карточек: '+(before-SRS.list.length))});
document.getElementById('all').onclick=()=>add(m.words);
box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>add(packs[+b.dataset.p].w));
box.querySelectorAll('[data-x]').forEach(b=>arm(b,'Вы уверены?',()=>{const pk=packs[+b.dataset.x],k=new Set(pk.w.map(x=>x[0]+'|'+x[1])),n0=SRS.list.length;
SRS.list=SRS.list.filter(c=>!k.has(c.f+'|'+c.b));srsSave();moduleScreen(m,'🗑 Удалено карточек: '+(n0-SRS.list.length))}))}

let queue=[],reviewed=0;
function srsStart(){
rollDay();const now=Date.now();
const due=SRS.list.filter(c=>c.st&&c.st.due<=now).sort((a,b)=>a.st.due-b.st.due);
const nw=SRS.list.filter(c=>!c.st).slice(0,Math.max(0,SRS.lim-SRS.n));
queue=[...due,...nw];reviewed=0;srsCard(false)}
function srsCard(back){
document.onkeydown=null;
if(!queue.length)return srsEnd();
const x=queue[0],c=x.st||fresh0();
const nNew=queue.filter(y=>!y.st).length,nRep=queue.length-nNew;
box.innerHTML=`<div class="srsbar"><button class="quit" id="bk">← Назад</button><span>Новых ${nNew} · повторов ${nRep}</span></div>
<div class="fc${back?' open':''}" id="fc"><div class="fq">${esc(x.f)}</div>${back?`<div class="fa">${esc(x.b)}</div>${x.t?`<div class="ft">${esc(x.t)}</div>`:''}`:'<div class="fh">Нажми на карточку, чтобы увидеть ответ</div>'}</div>
${back?`<div class="rt">${['Снова','Трудно','Хорошо','Легко'].map((l,r)=>`<div><small>${fmtIv(c,r)}</small><button class="r${r}" data-r="${r}">${l}</button></div>`).join('')}</div>`
:`<button class="big" id="sh">Показать ответ</button>`}`;
document.getElementById('bk').onclick=deckScreen;
if(back)box.querySelectorAll('.rt button').forEach(b=>b.onclick=()=>srsRate(+b.dataset.r));
else document.getElementById('sh').onclick=document.getElementById('fc').onclick=()=>srsCard(true);
document.onkeydown=e=>{
if(!back&&(e.key===' '||e.key==='Enter')){e.preventDefault();srsCard(true)}
else if(back&&/^[1-4]$/.test(e.key))srsRate(+e.key-1)
else if(back&&e.key===' '){e.preventDefault();srsRate(2)}}}
function srsRate(r){
const x=queue.shift(),isNew=!x.st;
x.st=sched(x.st||fresh0(),r);
if(isNew)SRS.n++;
srsSave();reviewed++;
if(r===0)queue.splice(Math.min(3,queue.length),0,x);
srsCard(false)}
function srsEnd(){
document.onkeydown=null;
const st=srsStats(),now=Date.now();
const nxt=SRS.list.filter(c=>c.st&&c.st.due>now).map(c=>c.st.due).sort((a,b)=>a-b)[0];
box.innerHTML=`<div class="center"><h2 style="margin:6px 0;font-size:28px">${reviewed?'На сегодня всё!':'Пока нечего повторять'}</h2><div class="sub">Повторено карточек: ${reviewed}</div></div>
<div class="fb">В колоде: <b>${st.total}</b> · выучено (интервал ≥ 21 дня): <b>${st.learned}</b>${nxt?`<br>Следующее повторение: <b>${when(nxt)}</b>`:''}${st.total&&!st.fresh&&SRS.list.some(c=>!c.st)?`<br>Лимит новых карточек на сегодня (${SRS.lim}) исчерпан.`:''}</div>
<button class="big" id="hm">К моим карточкам</button>`;
document.getElementById('hm').onclick=deckScreen}

planNotif();home();
</script></body></html>
